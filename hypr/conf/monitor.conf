# -----------------------------------------------------
# Monitor Setup (custom)
# Match by description so it doesn't matter which DP port each is plugged into.
# -----------------------------------------------------

# Primary: ASUS VG27A (serial L9LMQS034692) at 0x0
# vrr 2 = Adaptive-Sync only in fullscreen (games); off on the desktop to avoid flicker.
monitor = desc:ASUSTek COMPUTER INC VG27A L9LMQS034692, 2560x1440@143.97Hz, 0x0, 1, vrr, 2

# Secondary: ASUS VG27B (serial M2LMQS051631) to the right
# vrr 0 = VRR disabled entirely (no gaming here; always-on VRR was causing flicker).
monitor = desc:ASUSTek COMPUTER INC VG27B M2LMQS051631, 2560x1440@143.97Hz, 2560x0, 1, vrr, 0

# Ignore the Samsung TV on HDMI
monitor = desc:Samsung Electric Company, disable
