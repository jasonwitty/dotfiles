# tmux config - Catppuccin Frappe, matching macos/ghostty/config.ghostty
# Self-contained: no plugin manager needed. Glyphs need a Nerd Font
# (Ghostty ships Nerd Font symbols built in).

# --- General ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB,alacritty:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "#S  #W"
setw -g mode-keys vi
setw -g automatic-rename on
# Tab name: the running program, or the directory name when sitting at a shell.
# Claude Code's binary is named after its version (e.g. 2.1.322), so map that to "claude".
setw -g automatic-rename-format "#{?#{m/r:^(fish|zsh|bash|sh)$,#{pane_current_command}},#{b:pane_current_path},#{?#{m/r:^[0-9.]+$,#{pane_current_command}},claude,#{pane_current_command}}}"

# --- Keys (prefix stays Ctrl+B) ---------------------------------------------
# Splits and new windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Shift+Left/Right: previous/next tab, no prefix needed
bind -n S-Left  previous-window
bind -n S-Right next-window
# Shift+Up/Down: previous/next session, no prefix needed
bind -n S-Up   switch-client -p
bind -n S-Down switch-client -n
# prefix + < / >: move the current tab left/right
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
# prefix + r: reload this config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"
# vi-style copy: v to select, y to copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Palette (Catppuccin Frappe) ---------------------------------------------
set -g @base     "#303446"
set -g @surface0 "#414559"
set -g @surface1 "#51576d"
set -g @overlay  "#737994"
set -g @subtext  "#a5adce"
set -g @text     "#c6d0f5"
set -g @blue     "#8caaee"
set -g @mauve    "#ca9ee6"
set -g @green    "#a6d189"
set -g @peach    "#ef9f76"
set -g @yellow   "#e5c890"

# --- Status bar ----------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#c6d0f5"
set -g status-left-length 40
set -g status-right-length 80

# Left: session name pill (green; turns peach while the prefix is active)
set -g status-left "#[fg=#{?client_prefix,#{@peach},#{@green}},bg=default]#[fg=#{@base},bg=#{?client_prefix,#{@peach},#{@green}},bold] #S#[fg=#{?client_prefix,#{@peach},#{@green}},bg=default,nobold] "

# Tabs: inactive = dim pill, active = blue number + highlighted name
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#{@surface0},bg=default]#[fg=#{@subtext},bg=#{@surface0}]#I #W#{?window_bell_flag, !,}#[fg=#{@surface0},bg=default]"
setw -g window-status-current-format "#[fg=#{@blue},bg=default]#[fg=#{@base},bg=#{@blue},bold]#I #[fg=#{@text},bg=#{@surface1},nobold] #W#{?window_zoomed_flag, ,}#[fg=#{@surface1},bg=default]"
setw -g window-status-activity-style "none"
setw -g window-status-bell-style "none"

# Right: current directory, host, clock
set -g status-right "#[fg=#{@surface0},bg=default]#[fg=#{@mauve},bg=#{@surface0}] #[fg=#{@text}]#{b:pane_current_path}#[fg=#{@surface0},bg=default] #[fg=#{@surface0}]#[fg=#{@yellow},bg=#{@surface0}] #[fg=#{@text}]#h#[fg=#{@surface0},bg=default] #[fg=#{@blue}]#[fg=#{@base},bg=#{@blue},bold] %H:%M#[fg=#{@blue},bg=default,nobold]"

# --- Panes, messages, copy mode ---------------------------------------------------
set -g pane-border-style "fg=#51576d"
set -g pane-active-border-style "fg=#8caaee"
set -g pane-border-lines single
set -g message-style "bg=#414559,fg=#c6d0f5"
set -g message-command-style "bg=#414559,fg=#ef9f76"
setw -g mode-style "bg=#51576d,fg=#c6d0f5"
setw -g clock-mode-colour "#8caaee"
set -g display-panes-active-colour "#8caaee"
set -g display-panes-colour "#737994"
