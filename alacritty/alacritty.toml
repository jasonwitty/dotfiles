#theme = "Dracula"



#[colors.bright]
#black = "#575b70"
#blue = "#caa9fa"
#cyan = "#9aedfe"
#green = "#5af78e"
#magenta = "#ff92d0"
#red = "#ff6e67"
#white = "#e6e6e6"
#yellow = "#f4f99d"

#[colors.normal]
#black = "#000000"
#blue = "#caa9fa"
#cyan = "#8be9fd"
#green = "#50fa7b"
#magenta = "#ff79c6"
#red = "#ff5555"
#white = "#bfbfbf"
#yellow = "#f1fa8c"

#[colors.primary]
#background = "#000000"
#foreground = "#f8f8f2"

[cursor]
style = "Underline"

[env]
TERM = "xterm-256color"

[font]
size = 12

[font.bold]
family = "FiraCode Nerd Font Mono"

[font.bold_italic]
family = "FiraCode Nerd Font Mono"
#size = 12.0

[font.italic]
family = "FiraCode Nerd Font Mono"

[font.normal]
family = "FiraCode Nerd Font Mono"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[mouse]
hide_when_typing = true

[scrolling]
history = 10000
multiplier = 3

[terminal.shell]
program = "/usr/bin/fish"

[window]
decorations = "Full"
decorations_theme_variant = "None"
dynamic_padding = true
opacity = 0.4
title = "Alacritty"
padding.x = 2
padding.y = 1

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.dimensions]
columns = 100
lines = 30

[general]
live_config_reload = true
#save_to_clipboard = true
#theme = "Dracula"
#"window.dynamic_title" = true
import = [
		  #"~/.config/alacritty/alacritty-master/dracula.toml",
		  "~/.config/alacritty/catppuccin-latte.toml"]

[terminal]
